name: RTDB Security Rules CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Firebase Tools & Testing Library
        run: |
          npm install -g firebase-tools
          npm install --save-dev @firebase/rules-unit-testing jest

      - name: Run RTDB Rules Tests via Emulator
        run: |
          firebase emulators:exec --only database --project demo-test-project "npx jest database-rules.test.js"